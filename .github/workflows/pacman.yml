name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: abhayioadi

      - name: make pacman loop forever
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          for path in Path("dist").glob("pacman-contribution-graph*.svg"):
              svg = path.read_text(encoding="utf-8")
              try:
                  # 1. Loop forever
                  svg = re.sub(r'repeatCount="[^"]*"', 'repeatCount="indefinite"', svg)
                  svg = re.sub(
                      r'(<animate\w*\b(?![^>]*repeatCount)(?![^>]*attributeName="(?:fill|stroke)")[^>]*?)(/?>)',
                      r'\1 repeatCount="indefinite"\2',
                      svg,
                  )

                  def strip_freeze(m):
                      tag = m.group(0)
                      attr = re.search(r'attributeName="([^"]+)"', tag)
                      if attr and attr.group(1).lower() in ("fill", "stroke"):
                          return tag  # keep freeze: this sets/holds the cell's real color
                      return re.sub(r'\s*fill="freeze"', '', tag)

                  for elem in ("animate", "animateTransform", "set", "animateColor"):
                      svg = re.sub(rf'<{elem}\b[^>]*?/>', strip_freeze, svg)
                      svg = re.sub(rf'<{elem}\b[^>]*?>.*?</{elem}>', strip_freeze, svg, flags=re.S)

                  # 1b. Cover CSS-driven movement too (animation: ... in <style> rules
                  #     or inline style="" attributes) -> force infinite looping.
                  def fix_css_block(m):
                      body = m.group(0)
                      if 'animation-iteration-count' in body:
                          return re.sub(r'animation-iteration-count\s*:\s*[^;}]+',
                                         'animation-iteration-count: infinite', body)
                      if re.search(r'\banimation\s*:', body) and 'infinite' not in body:
                          return body[:-1] + ';animation-iteration-count:infinite' + body[-1]
                      return body

                  svg = re.sub(r'\{[^{}]*\}', fix_css_block, svg)

                  def fix_inline_style(m):
                      style = m.group(1)
                      if 'animation-iteration-count' in style:
                          style = re.sub(r'animation-iteration-count\s*:\s*[^;"]+',
                                          'animation-iteration-count: infinite', style)
                      elif re.search(r'\banimation\s*:', style) and 'infinite' not in style:
                          style = style.rstrip(';') + ';animation-iteration-count:infinite'
                      return f'style="{style}"'

                  svg = re.sub(r'style="([^"]*)"', fix_inline_style, svg)

                  path.write_text(svg, encoding="utf-8")
                  print(f"Patched {path}")
              except Exception as e:
                  print(f"WARNING: skipping {path}: {e}")
          PYEOF

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
