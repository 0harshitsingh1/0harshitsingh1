name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: abhayioadi

      - name: make pacman loop forever, non-destructive, dark background
        run: |
          python3 - dist/pacman-contribution-graph.svg << 'PYEOF'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          svg = path.read_text(encoding="utf-8")

          # 1. Loop forever
          svg = re.sub(r'repeatCount="[^"]*"', 'repeatCount="indefinite"', svg)
          svg = re.sub(
              r'(<animate(?:Transform)?\b(?![^>]*repeatCount)[^>]*?)(/?>)',
              r'\1 repeatCount="indefinite"\2',
              svg,
          )
          svg = re.sub(r'\s*fill="freeze"', '', svg)

          # 2. Don't eat the contributions: drop opacity/fill-opacity -> 0 animations
          def strip_disappear(m):
              tag = m.group(0)
              if not re.search(r'attributeName="(opacity|fill-opacity)"', tag):
                  return tag
              values = re.search(r'values="([^"]*)"', tag)
              to_val = re.search(r'to="([^"]*)"', tag)
              end = values.group(1).split(";")[-1].strip() if values else (to_val.group(1).strip() if to_val else None)
              return "" if end in ("0", "0.0", "0%") else tag

          svg = re.sub(r'<animate\b[^>]*?/>', strip_disappear, svg)
          svg = re.sub(r'<animate\b[^>]*?>.*?</animate>', strip_disappear, svg, flags=re.S)

          # 3. White -> black background
          WHITE = r'(#fff(?:fff)?|white|rgb\(\s*255\s*,\s*255\s*,\s*255\s*\))'
          svg = re.sub(
              r'(<svg\b[^>]*\bstyle="[^"]*background(?:-color)?\s*:\s*)' + WHITE,
              r'\g<1>#000000', svg, flags=re.I,
          )

          dims = re.search(r'<svg\b[^>]*\bwidth="(\d+)"[^>]*\bheight="(\d+)"', svg)
          w, h = (dims.group(1), dims.group(2)) if dims else (None, None)

          def fix_bg_rect(m):
              tag = m.group(0)
              if not re.search(r'fill="\s*' + WHITE + r'\s*"', tag, re.I):
                  return tag
              rw = re.search(r'width="([^"]*)"', tag)
              rh = re.search(r'height="([^"]*)"', tag)
              full = rw and rw.group(1) in ("100%", w) and (not h or (rh and rh.group(1) in ("100%", h)))
              x_ok = ('x="0"' in tag) or ('x=' not in tag)
              y_ok = ('y="0"' in tag) or ('y=' not in tag)
              if full and x_ok and y_ok:
                  return re.sub(r'fill="\s*' + WHITE + r'\s*"', 'fill="#000000"', tag, flags=re.I)
              return tag

          svg = re.sub(r'<rect\b[^>]*/?>', fix_bg_rect, svg)

          path.write_text(svg, encoding="utf-8")
          print(f"Patched {path}")
          PYEOF

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
