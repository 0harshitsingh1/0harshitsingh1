name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: abhayioadi

      - name: make pacman loop forever and stop eating contributions
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          for path in Path("dist").glob("pacman-contribution-graph*.svg"):
              svg = path.read_text(encoding="utf-8")
              try:
                  # Loop forever
                  svg = re.sub(r'repeatCount="[^"]*"', 'repeatCount="indefinite"', svg)
                  svg = re.sub(
                      r'(<animate(?:Transform)?\b(?![^>]*repeatCount)[^>]*?)(/?>)',
                      r'\1 repeatCount="indefinite"\2',
                      svg,
                  )
                  svg = re.sub(r'\s*fill="freeze"', '', svg)

                  # Don't eat the contributions: drop opacity/fill-opacity -> 0 animations
                  def strip_disappear(m):
                      tag = m.group(0)
                      if not re.search(r'attributeName="(opacity|fill-opacity)"', tag):
                          return tag
                      values = re.search(r'values="([^"]*)"', tag)
                      to_val = re.search(r'to="([^"]*)"', tag)
                      end = values.group(1).split(";")[-1].strip() if values else (to_val.group(1).strip() if to_val else None)
                      return "" if end in ("0", "0.0", "0%") else tag

                  svg = re.sub(r'<animate\b[^>]*?/>', strip_disappear, svg)
                  svg = re.sub(r'<animate\b[^>]*?>.*?</animate>', strip_disappear, svg, flags=re.S)

                  path.write_text(svg, encoding="utf-8")
                  print(f"Patched {path}")
              except Exception as e:
                  print(f"WARNING: skipping {path}: {e}")
          PYEOF

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
